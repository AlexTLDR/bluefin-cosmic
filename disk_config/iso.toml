# Installer ISO config, used by the "Build disk images" workflow and `just build-iso`.
# Based on the template's iso-kde.toml: the installer itself creates your user
# and sets the timezone, because GNOME's first-boot setup doesn't run on this
# image (GDM is replaced by the COSMIC greeter).
# The %post line makes the installed system update from your registry image.
# GHCR paths must be lowercase.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/alextldr/bluefin-cosmic:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
